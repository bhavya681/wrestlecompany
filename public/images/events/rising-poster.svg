<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200" role="img" aria-label="IM: RISING event poster">
  <defs>
    
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    <feComposite operator="over" in2="SourceGraphic"/>
  </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="0.55" stop-color="#080808"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="34%" r="62%">
      <stop offset="0" stop-color="#DC2626" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#DC2626" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="1200" fill="url(#bg)"/>
  <rect width="800" height="1200" fill="url(#glow)"/>
  <rect width="800" height="1200" fill="url(#grid)"/>
  <g opacity="0.55">
    <path d="M 800 0 L 800 744 L 416 0 Z" fill="#DC2626" opacity="0.16"/>
    <path d="M 528 0 L 800 0 L 800 360 Z" fill="#DC2626" opacity="0.4"/>
  </g>
  <text x="62" y="84" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="21" letter-spacing="7" fill="#ffffff">INDUS MATWORKS</text>
  <text x="62" y="114" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12" letter-spacing="4.2" fill="#a1a1aa">PROFESSIONAL WRESTLING</text>
  <line x1="62" y1="140" x2="270" y2="140" stroke="#DC2626" stroke-width="3"/>
  <text x="62" y="300" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="15" letter-spacing="6" fill="#DC2626">NEW STARS. OLD GRUDGES.</text>
  <text x="62" y="430" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="168" fill="#ffffff" letter-spacing="-4">RIS</text>
<text x="62" y="580" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="168" fill="#C1272D" letter-spacing="-4">ING</text>
  <text x="66" y="740" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="24" letter-spacing="2.5" fill="#d4d4d8">NEW STARS. OLD GRUDGES.</text>
  
    <g opacity="0.55" stroke="#DC2626" fill="none">
      <path d="M -40 950 C 200 870, 560 1030, 840 940" stroke-width="3"/>
      <path d="M -40 1010 C 200 930, 560 1090, 840 1000" stroke-width="3"/>
      <path d="M -40 1070 C 200 990, 560 1150, 840 1060" stroke-width="3"/>
      <path d="M 96 1200 L 160 900" stroke-width="2"/>
      <path d="M 704 1200 L 640 900" stroke-width="2"/>
    </g>
  <g>
    <rect x="62" y="1010" width="676" height="1" fill="#3f3f46"/>
    <text x="62" y="1058" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="34" letter-spacing="1" fill="#ffffff">14 DECEMBER 2024</text>
    <text x="62" y="1092" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="17" letter-spacing="3" fill="#DC2626">Bengaluru</text>
    <text x="62" y="1122" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="15" fill="#a1a1aa">Karnataka State Hockey Association Stadium</text>
    <text x="738" y="1122" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" letter-spacing="2.4" fill="#71717a">WRESTLING FROM INDIA</text>
  </g>
  <text x="760" y="564" text-anchor="end" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="360" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2">RISE</text>
  <rect width="800" height="1200" filter="url(#grain)" opacity="0.6"/>
</svg>